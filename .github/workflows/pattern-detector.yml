name: PipSight Pro AI - 5 Minute Execution

on:
  schedule:
    # Run every 5 minutes
    - cron: "*/5 * * * *"

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipsight-pro-ai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pro-ai-engine:
    name: Run PipSight Pro AI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Pro AI system
        run: npm test

      - name: Run PipSight Pro AI
        run: npm start

      - name: Commit and push generated updates
        shell: bash
        run: |
          set -e

          git config user.email "bot@detector-byte.com"
          git config user.name "PipSight Pro AI"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes to commit"
            exit 0
          fi

          echo "Generated changes detected:"
          git status --short

          git add -A

          git commit \
            -m "🤖 PipSight Pro AI update - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          git pull --rebase origin "${{ github.ref_name }}"

          git push origin "HEAD:${{ github.ref_name }}"

      - name: Execution summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "PipSight Pro AI execution completed"
          echo "Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run number: ${{ github.run_number }}"
          echo "Run result: ${{ job.status }}"
          echo "========================================"
